<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Visual Foundations</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="kit/kit.css"><script src="kit/vendor/chart.umd.js"></script><script>window.KIT_STATIC = {"api/meta": {"number": "08", "title": "DS Visual Foundations", "subtitle": "Intuition \u00b7 rigorous math \u00b7 live simulation \u00b7 quizzes for four core ideas", "hub": false, "custom_js": true, "pages": [{"id": "home", "title": "Start here", "group": "Course"}, {"id": "naive-bayes", "title": "1 \u00b7 Naive Bayes", "group": "Modules"}, {"id": "evaluation", "title": "2 \u00b7 Model evaluation", "group": "Modules"}, {"id": "gradient-descent", "title": "3 \u00b7 Gradient descent", "group": "Modules"}, {"id": "backprop", "title": "4 \u00b7 Backpropagation", "group": "Modules"}]}, "api/page/home": {"blocks": [{"t": "h", "text": "Data science, visually", "sub": "A mini-course for beginners who want both the intuition and the equations."}, {"t": "md", "text": "\nFour ideas carry most of introductory machine learning. Each module follows the same path:\n\n1. **Intuition** in plain language\n2. **Rigorous math** \u2014 the actual formulas, nothing hidden\n3. **Live simulation** \u2014 drag sliders and watch the math respond\n4. **Quiz** with explanations, plus **interview questions** with model answers\n\n| Module | The big question | Connects to |\n|---|---|---|\n| Naive Bayes | How do I turn counts into a probability? | Bayes' rule, smoothing, log-odds |\n| Model evaluation | Which mistakes can I afford? | Confusion matrix, ROC, PR, cost |\n| Derivatives \u2192 gradient descent | Which way is downhill, and how far do I step? | Limits, Taylor expansion, learning rate |\n| Chain rule \u2192 backpropagation | Who is responsible for the error? | Composition, local derivatives, vanishing gradients |\n\nEverything runs in your browser \u2014 this course is also published as a static site (see `docs/visual-mastery/`).\n", "title": null}]}, "api/page/naive-bayes": {"blocks": [{"t": "h", "text": "Naive Bayes", "sub": "Turning word counts into a probability of spam."}, {"t": "md", "text": "\n## Intuition\nEvery word in a message is a small piece of evidence. *\"free\"* shows up far more often in spam than in normal mail, so seeing it should raise our suspicion; *\"meeting\"* should lower it. Naive Bayes simply **adds up the votes**.\n\n## The math\nBayes' rule for a class *c* and words *w\u2081\u2026w\u2099*:\n\n`P(c | w\u2081\u2026w\u2099) \u221d P(c) \u00b7 P(w\u2081\u2026w\u2099 | c)`\n\nThe **naive** assumption \u2014 words are conditionally independent given the class \u2014 factorises the likelihood:\n\n`P(c | w\u2081\u2026w\u2099) \u221d P(c) \u00b7 \u220f\u1d62 P(w\u1d62 | c)`\n\nIn log space (to avoid underflow) the decision becomes a sum:\n\n`log-odds(spam) = log P(spam)/P(ham) + \u03a3\u1d62 log P(w\u1d62|spam)/P(w\u1d62|ham)`\n\nEach likelihood is estimated with **Laplace smoothing**: `P(w | c) = (count(w, c) + \u03b1) / (N_c + \u03b1\u00b7|V|)`, so an unseen word never produces a zero.\n\n## Try it\nChange the message, then drag **\u03b1 to 0** and type a word that only appears in one class (e.g. *prize*) to watch the zero-frequency problem veto everything else.\n", "title": null}, {"t": "custom", "name": "nb", "props": {}, "title": "Live simulation"}, {"t": "quiz", "title": "Check your understanding", "questions": [{"q": "Why is Naive Bayes called *naive*?", "options": ["It ignores the prior", "It assumes features are conditionally independent given the class", "It only works for two classes", "It uses a linear kernel"], "answer": 1, "why": "The independence assumption is rarely true (\"free\" and \"prize\" co-occur) but the classifier is often still accurate because only the *ranking* of classes matters."}, {"q": "With \u03b1 = 0, a test message contains a word never seen in ham. What is P(ham | message)?", "options": ["Unchanged", "Exactly 0", "0.5", "1"], "answer": 1, "why": "One zero factor zeroes the whole product \u2014 the zero-frequency problem that Laplace smoothing fixes."}, {"q": "Why do implementations sum log-probabilities instead of multiplying probabilities?", "options": ["Logs are more accurate", "To avoid floating-point underflow on long documents", "Because Bayes' rule requires it", "To make the model non-linear"], "answer": 1, "why": "Hundreds of probabilities < 1 multiplied together underflow to 0.0; sums of logs do not."}, {"q": "Raising the prior P(spam) from 0.4 to 0.8 does what to the decision?", "options": ["Nothing", "Adds a constant to the spam log-odds, so less word evidence is needed", "Changes the word likelihoods", "Removes the need for smoothing"], "answer": 1, "why": "The prior is the starting vote; likelihoods are untouched."}]}, {"t": "html", "html": "<details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">1. When does Naive Bayes beat logistic regression?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">With very little training data: NB (generative) reaches its asymptotic error faster, while LR (discriminative) has lower asymptotic error (Ng &amp; Jordan, 2001). Also when training speed matters \u2014 NB is one pass of counting.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">2. Are Naive Bayes probabilities trustworthy?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">No \u2014 correlated features are double-counted, pushing outputs toward 0 or 1. The ranking is good, the calibration is poor; apply Platt scaling or isotonic regression if you need probabilities.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">3. How do you handle continuous features?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">Gaussian NB models each feature as a per-class normal; alternatively discretise, or use kernel density estimates.</div></details>", "title": "Interview prep \u2014 click a question to reveal a model answer"}]}, "api/page/evaluation": {"blocks": [{"t": "h", "text": "Model evaluation", "sub": "Confusion matrix, Type I / II errors, ROC-AUC, cost matrix and the precision\u2013recall trade-off."}, {"t": "md", "text": "\n## Intuition\nA classifier outputs a **score**; a **threshold** turns the score into a decision. Slide the threshold right and you raise fewer false alarms but miss more real cases. There is no free lunch \u2014 only a trade-off you choose according to what each mistake *costs*.\n\n## The math\n| | predicted + | predicted \u2212 |\n|---|---|---|\n| **actual +** | TP | FN \u2014 *Type II error* (miss) |\n| **actual \u2212** | FP \u2014 *Type I error* (false alarm) | TN |\n\n- **Precision** = TP / (TP + FP) \u2014 when I raise an alarm, how often am I right?\n- **Recall / TPR** = TP / (TP + FN) \u2014 of the real positives, how many did I catch?\n- **FPR** = FP / (FP + TN) \u2014 the Type I error rate \u03b1. **1 \u2212 recall** is the Type II rate \u03b2.\n- **ROC curve**: TPR vs FPR for every threshold; **AUC** = P(score of a random positive > score of a random negative).\n- **Expected cost** = FP\u00b7c_FP + FN\u00b7c_FN. For a calibrated model the optimal threshold is `c_FP / (c_FP + c_FN)`.\n\n## Try it\n1. Set prevalence to 2% \u2014 accuracy stays ~98% while precision collapses. ROC barely moves; the PR curve tells the truth.\n2. Make a false negative 20\u00d7 as costly as a false positive and watch the cost-optimal threshold slide left.\n", "title": null}, {"t": "custom", "name": "evalsim", "props": {}, "title": "Live simulation"}, {"t": "quiz", "title": "Check your understanding", "questions": [{"q": "A cancer screen flags a healthy patient. Which error is this?", "options": ["Type I (false positive)", "Type II (false negative)", "Both", "Neither"], "answer": 0, "why": "Rejecting a true null hypothesis ('patient is healthy') is a Type I error."}, {"q": "Prevalence drops from 30% to 2% with the same model and threshold. What happens?", "options": ["Recall drops", "FPR drops", "Precision drops", "AUC drops"], "answer": 2, "why": "TPR and FPR are conditioned on the true class, so they (and ROC-AUC) do not change; precision mixes the classes and collapses when negatives dominate."}, {"q": "ROC-AUC of 0.5 means\u2026", "options": ["Half of predictions are correct", "The model ranks no better than chance", "Precision equals recall", "The threshold is 0.5"], "answer": 1, "why": "AUC is the probability a random positive outranks a random negative."}, {"q": "Missing fraud costs $500, a false alert costs $5. Compared with 0.5, the threshold should be\u2026", "options": ["Higher", "Much lower", "Exactly 0.5", "Irrelevant"], "answer": 1, "why": "Optimal threshold \u2248 5 / (5 + 500) \u2248 0.01 for a calibrated model: flag almost anything suspicious."}]}, {"t": "html", "html": "<details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">1. When would you prefer PR-AUC over ROC-AUC?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">Heavily imbalanced problems where the positive class is what matters (fraud, rare disease). ROC-AUC is dominated by the abundant true negatives and can look excellent while precision is terrible.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">2. Is accuracy ever the right metric?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">When classes are balanced and both error types cost the same. Otherwise report a cost-weighted metric or precision at a required recall.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">3. How do you choose a threshold in production?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">On a validation set (never the test set): either minimise expected cost with business-supplied error costs, or fix an operating constraint such as 'recall \u2265 95%' and maximise precision subject to it. Re-check when prevalence drifts.</div></details>", "title": "Interview prep \u2014 click a question to reveal a model answer"}]}, "api/page/gradient-descent": {"blocks": [{"t": "h", "text": "Derivatives \u2192 gradient descent", "sub": "From the slope of a secant line to an optimiser that trains every neural network."}, {"t": "md", "text": "\n## Intuition\nThe derivative answers: *if I nudge x a tiny bit, how much does f(x) change?* Geometrically it is the slope of the tangent line. If the slope is positive, moving left goes downhill; if negative, moving right does. **Gradient descent** just repeats that observation.\n\n## The math\nThe derivative is the limit of secant slopes:\n\n`f\u2032(x) = lim (h\u21920) [ f(x + h) \u2212 f(x) ] / h`\n\nA first-order Taylor expansion, `f(x + \u0394) \u2248 f(x) + f\u2032(x)\u00b7\u0394`, says choosing `\u0394 = \u2212\u03b7\u00b7f\u2032(x)` gives `f(x + \u0394) \u2248 f(x) \u2212 \u03b7\u00b7f\u2032(x)\u00b2 \u2264 f(x)`. Hence the update rule\n\n`x\u209c\u208a\u2081 = x\u209c \u2212 \u03b7 \u00b7 f\u2032(x\u209c)`\n\nFor `f(x) = x\u00b2` this is `x\u209c\u208a\u2081 = (1 \u2212 2\u03b7)\u00b7x\u209c`: it converges iff `|1 \u2212 2\u03b7| < 1`, i.e. **0 < \u03b7 < 1**. In many dimensions f\u2032 becomes the gradient \u2207f and the rule is identical.\n\n## Try it\n- Shrink **h** and watch the dashed secant rotate onto the tangent.\n- On x\u00b2, set \u03b7 = 0.9 (oscillates), then \u03b7 = 1.05 (diverges).\n- On the two-valley function, start at x\u2080 = \u22121.8 and then x\u2080 = 1.8: same algorithm, different minimum.\n", "title": null}, {"t": "custom", "name": "gdsim", "props": {}, "title": "Live simulation"}, {"t": "quiz", "title": "Check your understanding", "questions": [{"q": "For f(x) = x\u00b2, what happens with learning rate \u03b7 = 1?", "options": ["Converges in one step", "Oscillates forever between x\u2080 and \u2212x\u2080", "Diverges", "Does not move"], "answer": 1, "why": "x\u209c\u208a\u2081 = (1 \u2212 2\u00b71)x\u209c = \u2212x\u209c: it jumps to the mirror point each step."}, {"q": "The gradient at the current point is exactly 0. Gradient descent will\u2026", "options": ["Stop moving", "Speed up", "Reverse direction", "Diverge"], "answer": 0, "why": "The update is \u2212\u03b7\u00b70. This could be a minimum, a maximum or a saddle point \u2014 the algorithm cannot tell."}, {"q": "Why does gradient descent find different answers from different starts on a non-convex function?", "options": ["Numerical error", "It follows the local slope into whichever basin it starts in", "The learning rate changes", "It is random"], "answer": 1, "why": "GD is a local method; only convex functions guarantee the global minimum."}, {"q": "As h \u2192 0, the secant slope approaches\u2026", "options": ["0", "f(x)", "The derivative f\u2032(x)", "Infinity"], "answer": 2, "why": "That limit is the definition of the derivative."}]}, {"t": "html", "html": "<details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">1. Why use stochastic gradient descent instead of full-batch?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">Each step costs O(batch) instead of O(N); the gradient noise acts as a regulariser and helps escape saddle points and sharp minima. Mini-batches balance noise against vectorisation.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">2. What do momentum and Adam add?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">Momentum averages past gradients to damp oscillation across steep directions and accelerate along shallow ones. Adam additionally rescales each parameter's step by a running estimate of its gradient variance.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">3. How do you pick a learning rate?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">A learning-rate range test (increase \u03b7 exponentially, pick just below where loss blows up), then a schedule \u2014 warm-up followed by cosine or step decay.</div></details>", "title": "Interview prep \u2014 click a question to reveal a model answer"}]}, "api/page/backprop": {"blocks": [{"t": "h", "text": "Chain rule \u2192 backpropagation", "sub": "How one rule from calculus computes millions of gradients in a single backward sweep."}, {"t": "md", "text": "\n## Intuition\nA network is a chain of simple functions. To know how the loss reacts to a weight deep inside, ask each link how much it amplifies a small change \u2014 and **multiply the answers along the path**. Backpropagation does that multiplication from the output backwards, reusing every shared piece.\n\n## The math\nFor a composition `L = f(g(h(w)))` the chain rule gives\n\n`dL/dw = (dL/df)\u00b7(df/dg)\u00b7(dg/dh)\u00b7(dh/dw)`\n\nFor the single neuron below \u2014 `z = w\u00b7x + b`, `a = \u03c3(z)`, `L = (a \u2212 t)\u00b2` \u2014 the local derivatives are\n\n`\u2202L/\u2202a = 2(a \u2212 t)`  \u00b7  `\u2202a/\u2202z = \u03c3(z)(1 \u2212 \u03c3(z))`  \u00b7  `\u2202z/\u2202w = x`  \u00b7  `\u2202z/\u2202b = 1`\n\nso `\u2202L/\u2202w = 2(a \u2212 t) \u00b7 a(1 \u2212 a) \u00b7 x`. Backprop computes `\u03b4 = \u2202L/\u2202z` **once** and reuses it for both w and b; in a deep net each layer's \u03b4 is built from the next layer's, which makes the cost of *all* gradients about the same as one forward pass.\n\n## Try it\n- Push **w** to 3 with x = 3: the sigmoid saturates, \u03c3\u2032(z) \u2192 0 and the gradient vanishes although the loss is large.\n- Click **Gradient step** repeatedly and watch the loss fall.\n", "title": null}, {"t": "custom", "name": "backprop", "props": {}, "title": "Live simulation"}, {"t": "quiz", "title": "Check your understanding", "questions": [{"q": "In the neuron above, which quantity is shared by \u2202L/\u2202w and \u2202L/\u2202b?", "options": ["x", "\u03b4 = \u2202L/\u2202z", "The target t", "The learning rate"], "answer": 1, "why": "Both are \u03b4 times a local derivative (x for w, 1 for b). Reusing \u03b4 is the whole point of backprop."}, {"q": "If x = 0, what is \u2202L/\u2202w?", "options": ["Equal to \u2202L/\u2202b", "0 \u2014 the weight had no effect on the output", "Infinite", "Equal to the loss"], "answer": 1, "why": "\u2202z/\u2202w = x = 0, so the chain is cut. (The bias still gets gradient.)"}, {"q": "Why do sigmoid networks suffer vanishing gradients?", "options": ["\u03c3\u2032(z) \u2264 0.25, and many such factors are multiplied through depth", "Sigmoids are not differentiable", "The loss is always zero", "Weights are too large"], "answer": 0, "why": "Each layer multiplies the backward signal by at most 0.25, so it shrinks geometrically."}, {"q": "Backprop's cost relative to a forward pass is roughly\u2026", "options": ["Exponential in depth", "One forward pass per parameter", "A small constant multiple", "Zero"], "answer": 2, "why": "Reverse-mode autodiff computes all partial derivatives of a scalar loss in O(forward cost)."}]}, {"t": "html", "html": "<details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">1. What is the difference between forward- and reverse-mode autodiff?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">Forward mode pushes one input's perturbation through the graph \u2014 cost \u221d number of inputs. Reverse mode (backprop) pulls one output's sensitivity back \u2014 cost \u221d number of outputs. A scalar loss with millions of weights makes reverse mode the obvious choice.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">2. How do residual connections help gradients?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">y = x + F(x) has Jacobian I + \u2202F/\u2202x, so the identity path carries gradient unchanged through any depth instead of a product of small factors.</div></details><details style=\"margin:8px 0\"><summary style=\"cursor:pointer;font-weight:600\">3. How would you check a hand-written backward pass?</summary><div class=\"md\" style=\"margin:6px 0 0 18px;color:var(--ink2)\">Gradient checking: compare each analytic gradient to the centred finite difference (f(\u03b8+\u03b5) \u2212 f(\u03b8\u2212\u03b5)) / 2\u03b5 and require a relative error below ~1e-6.</div></details>", "title": "Interview prep \u2014 click a question to reveal a model answer"}]}};</script>
